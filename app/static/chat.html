<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><title>Agentic Commerce Demo</title>
<style>
:root{
  --navy:#0c2451; --navy-dark:#08183a; --blue:#3395ff; --blue-dark:#1f6fe0;
  --bg:#f4f6fb; --card:#ffffff; --border:#e2e8f5; --text:#1a2233; --muted:#6b7690;
}
*{box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;margin:0;background:var(--bg);color:var(--text)}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 32px}

header{background:var(--navy);color:#fff;padding:18px 16px;margin-bottom:20px;border-radius:0 0 14px 14px;
  display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(12,36,81,.15)}
header h2{margin:0;font-size:17px;font-weight:700;letter-spacing:-.3px}
header .dot{width:8px;height:8px;border-radius:50%;background:#3ce27a;display:inline-block;margin-right:8px;box-shadow:0 0 0 3px rgba(60,226,122,.2)}
header .badge{font-size:11px;color:#b9c8ef;font-weight:500}

.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(12,36,81,0.05)}
.card h4{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700}

#log{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;min-height:140px;max-height:420px;overflow-y:auto;box-shadow:0 1px 3px rgba(12,36,81,0.05);margin-bottom:12px}
#log div{margin:8px 0;padding:10px 14px;border-radius:12px;white-space:pre-wrap;font-size:13.5px;line-height:1.45;max-width:85%}
.user{background:var(--blue);color:#fff;margin-left:auto;border-bottom-right-radius:3px}
.agent{background:#eef2fb;color:var(--text);margin-right:auto;border-bottom-left-radius:3px;font-family:ui-monospace,Consolas,monospace;font-size:12.5px}

.input-row{display:flex;gap:8px;margin-bottom:20px}
input{flex:1;padding:11px 14px;border:1px solid var(--border);border-radius:10px;font-size:14px;outline:none;background:#fff}
input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(51,149,255,.15)}

button{padding:9px 16px;border:none;border-radius:9px;background:var(--blue);color:#fff;font-weight:600;font-size:13px;cursor:pointer;transition:background .15s,transform .1s}
button:hover{background:var(--blue-dark)}
button:active{transform:scale(.97)}
.btn-primary{background:var(--navy)}
.btn-primary:hover{background:var(--navy-dark)}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}

#panel{display:none}
#offer-box{background:#f8fafc;border:1px dashed var(--border);border-radius:10px;padding:12px;font-size:12.5px;font-family:ui-monospace,Consolas,monospace;color:var(--muted);white-space:pre-wrap;margin-bottom:12px}
#pending-box, #payment-box{margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
#pending-box p{margin:0 0 8px;font-size:13px;font-weight:600;color:var(--navy)}

.tools-row{display:flex;gap:8px;margin-bottom:14px}
.tools-row button{background:#fff;color:var(--navy);border:1px solid var(--border)}
.tools-row button:hover{background:#eef2fb}

#audit-log{background:var(--navy);color:#cfe0ff;padding:16px;border-radius:12px;font-size:12px;overflow-x:auto;white-space:pre-wrap;margin:0}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h2><span class="dot"></span>Shopping Agent</h2>
    <span class="badge">Buyer · port 8000</span>
  </header>

  <div id="log"></div>

  <div class="input-row">
    <input id="msg" placeholder="I need headphones under 5000" onkeydown="if(event.key==='Enter')send()">
    <button onclick="send()">Send</button>
  </div>

  <div id="panel" class="card">
    <h4>Current Offer</h4>
    <div id="offer-box"></div>
    <div class="btn-row">
      <button id="negotiate-btn" onclick="negotiate()">Ask for Discount</button>
      <button id="accept-btn" class="btn-primary" onclick="acceptOffer()">Accept Offer</button>
    </div>

    <div id="pending-box" style="display:none">
      <p>Needs your approval</p>
      <div class="btn-row">
        <button class="btn-primary" onclick="approvePending()">Approve</button>
        <button onclick="rejectPending()" style="background:#e5574d">Reject</button>
      </div>
    </div>

    <div id="payment-box" style="display:none">
      <div class="btn-row">
        <button onclick="checkPaymentStatus()">Check Payment Status</button>
        <button id="retry-btn" onclick="retryPayment()" style="display:none">Retry (new link)</button>
      </div>
    </div>
  </div>

  <div class="tools-row">
    <button onclick="showAudit()">Show Audit Trail</button>
    <button onclick="showAgentCard()">Show Merchant Agent Card</button>
  </div>

  <pre id="audit-log"></pre>

</div>

<script>
const sessionId = crypto.randomUUID();
let currentOfferId = null;
let currentAgreementId = null;
const log = document.getElementById('log');

function addMsg(text, cls){
  const d = document.createElement('div');
  d.className = cls; d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight;
}

async function send(){
  const input = document.getElementById('msg');
  const text = input.value; if(!text) return;
  addMsg(text, 'user'); input.value = '';
  const res = await fetch('/chat', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({session_id: sessionId, message: text})
  });
  const data = await res.json();
  addMsg(data.reply, 'agent');
  if(data.done && data.offer){
    currentOfferId = data.offer.offer_id;
    document.getElementById('offer-box').textContent = 'Offer: ' + JSON.stringify(data.offer, null, 2);
    document.getElementById('panel').style.display = 'block';
    document.getElementById('pending-box').style.display = 'none';
    document.getElementById('payment-box').style.display = 'none';
  }
}

async function negotiate(){
  const discount = prompt("How much discount are you asking for (₹)?", "100");
  if(!discount) return;
  const res = await fetch('/negotiate', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({session_id: sessionId, offer_id: currentOfferId, requested_discount: parseInt(discount)})
  });
  const data = await res.json();
  addMsg(data.reply, 'agent');
  if(data.offer && data.offer.offer_id){
    currentOfferId = data.offer.offer_id;
    document.getElementById('offer-box').textContent = 'Offer: ' + JSON.stringify(data.offer, null, 2);
  }
}

async function acceptOffer(){
  const res = await fetch('/accept', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({session_id: sessionId, offer_id: currentOfferId})
  });
  const data = await res.json();
  addMsg('Accept result: ' + JSON.stringify(data, null, 2), 'agent');
  currentAgreementId = data.agreement_id;

  if(data.status === 'PENDING_HUMAN_APPROVAL'){
    document.getElementById('pending-box').style.display = 'block';
  } else if(data.payment && data.payment.payment_link_url){
    document.getElementById('payment-box').style.display = 'block';
    addPaymentLink(data.payment.payment_link_url);
  }
}

async function approvePending(){
  const res = await fetch('/approve', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({session_id: sessionId, agreement_id: currentAgreementId})
  });
  const data = await res.json();
  addMsg('Approve result: ' + JSON.stringify(data, null, 2), 'agent');
  document.getElementById('pending-box').style.display = 'none';
  if(data.payment && data.payment.payment_link_url){
    document.getElementById('payment-box').style.display = 'block';
    addPaymentLink(data.payment.payment_link_url);
  }
}

async function rejectPending(){
  const res = await fetch('/reject', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({session_id: sessionId, agreement_id: currentAgreementId})
  });
  const data = await res.json();
  addMsg('Reject result: ' + JSON.stringify(data, null, 2), 'agent');
  document.getElementById('pending-box').style.display = 'none';
}

async function checkPaymentStatus(){
  const res = await fetch('/payment-status', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({session_id: sessionId, agreement_id: currentAgreementId})
  });
  const data = await res.json();
  addMsg('Payment status (real Razorpay check): ' + JSON.stringify(data, null, 2), 'agent');
  document.getElementById('retry-btn').style.display = data.recommend_retry ? 'inline-block' : 'none';
}

async function retryPayment(){
  const res = await fetch('/retry-payment', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({session_id: sessionId, agreement_id: currentAgreementId})
  });
  const data = await res.json();
  addMsg('Retry result: ' + JSON.stringify(data, null, 2), 'agent');
  if(data.payment_link_url) addPaymentLink(data.payment_link_url);
}

function addPaymentLink(url){
  const d = document.createElement('div');
  d.className = 'agent';
  const a = document.createElement('a');
  a.href = url; a.target = '_blank'; a.rel = 'noopener';
  a.textContent = '💳 Open payment link: ' + url;
  a.style.color = '#3395ff'; a.style.fontWeight = '600'; a.style.textDecoration = 'underline';
  d.appendChild(a);
  log.appendChild(d); log.scrollTop = log.scrollHeight;
  window.open(url, '_blank'); // auto-redirect to Razorpay checkout
}

async function showAudit(){
  const res = await fetch('/audit');
  const data = await res.json();
  document.getElementById('audit-log').textContent =
    `Chain verified: ${data.chain_verified}\n\n` + JSON.stringify(data.timeline, null, 2);
}

async function showAgentCard(){
  const res = await fetch('/agent-card');
  const data = await res.json();
  document.getElementById('audit-log').textContent =
    'Merchant Agent Card (via A2A discovery):\n\n' + JSON.stringify(data, null, 2);
}
</script>
</body>
</html>
